<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIBLE TASTE GAMES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="page-index">

  <header>
    <h1 class="retro-title">BIBLE TASTE<br>GAMES</h1>
    <div class="subtitle">🕹️ わくわくゲームセンター 🕹️</div>
    <div><button type="button" id="soundBtn" class="sound-toggle">🎵 音声を有効化</button></div>

  <main class="game-list">

    <!-- ゲームを追加するときは、この article をコピーして theme クラスと href を変更 -->
    <article class="card game-card game-card--ark">
      <h2 class="game-title">ノアの箱舟ゲーム</h2>
      <p class="game-description">
        やってきた動物を乗せるか、乗せないか選ぶだけの簡単ゲームだよ
      </p>
      <a href="ark_game.html" class="btn btn--block btn--pink play-btn">遊ぶ (PLAY)</a>
    </article>

    <article class="card game-card game-card--eden">
      <h2 class="game-title">エデンの園ゲーム</h2>
      <p class="game-description">
        エデンの園にやってきた人たちを天使で追い返すだけの簡単ゲームだよ
      </p>
      <a href="eden_game.html" class="btn btn--block btn--green play-btn">遊ぶ (PLAY)</a>
    </article>

  </main>

  <footer class="site-footer">
    <p>&copy; BIBLE TASTE GAMES All Rights Reserved.</p>
  </footer>

  <script src="js/audio.js"></script>
  <script src="js/index.js"></script>
