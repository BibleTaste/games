 <style>
 * {
   box-sizing: border-box;
 }

 /* 全体のスタイル（index.htmlと統一） */
 body {
   background-color: #1b153a; /* ポップな濃いパープル */
   color: #333;
   font-family: 'M PLUS Rounded 1c', sans-serif;
   margin: 0;
   padding: 15px 10px;
   display: flex;
   flex-direction: column;
   align-items: center;
   min-height: 100vh;
   background-image: 
     radial-gradient(#392c6e 15%, transparent 16%),
     radial-gradient(#392c6e 15%, transparent 16%);
   background-size: 30px 30px;
   background-position: 0 0, 15px 15px;
   overflow-x: hidden;
   transition: background-color 0.5s ease;
 }

 body.success-bg {
   background-color: #0d47a1;
 }

 body.error-bg {
   background-color: #212121 !important;
 }

 /* メインコンテナ（白カード枠） */
 .main-card {
   background: #ffffff;
   border: 5px solid #000000;
   border-radius: 20px;
   padding: 20px 15px;
   box-shadow: 6px 6px 0px #000000;
   width: 100%;
   max-width: 650px;
   display: flex;
   flex-direction: column;
   align-items: center;
   margin-bottom: 20px;
 }

 /* タイトル */
 h1 {
   font-family: 'Press Start 2P', cursive, sans-serif;
   font-size: 1.8rem;
   color: #ffde59; /* レトロイエロー */
   text-shadow: 3px 3px 0px #ff3131, 6px 6px 0px #000000;
   letter-spacing: 1px;
   margin: 0 0 15px 0;
   text-align: center;
   line-height: 1.3;
 }

 /* 戻るボタン */
 .back-btn {
   display: inline-block;
   background-color: #ff66c4;
   color: #ffffff;
   font-weight: 900;
   font-size: 0.95rem;
   padding: 8px 18px;
   border: 3.5px solid #000000;
   border-radius: 12px;
   text-decoration: none;
   box-shadow: 0 4px 0 #000000;
   margin-bottom: 15px;
   transition: all 0.1s;
 }

 .back-btn:active {
   transform: translateY(3px);
   box-shadow: 0 1px 0 #000000;
 }

 /* 言語切替エリア */
 .lang-switch-container {
   margin-bottom: 12px;
   background: #f0f0f0;
   border: 3px solid #000000;
   padding: 4px;
   border-radius: 15px;
   display: flex;
   gap: 4px;
 }

 .lang-btn {
   background: none;
   border: 2px solid transparent;
   padding: 4px 10px;
   border-radius: 10px;
   cursor: pointer;
   font-size: 0.8rem;
   font-weight: 900;
   color: #555;
   font-family: 'M PLUS Rounded 1c', sans-serif;
 }

 .lang-btn.active {
   background-color: #00c2cb;
   color: white;
   border-color: #000000;
 }

 /* 説明テキスト */
 .instructions {
   font-size: 0.85rem;
   margin: 0 0 12px 0;
   color: #333;
   line-height: 1.4;
   font-weight: 700;
   background-color: #fff9c4;
   border: 3px solid #000000;
   border-radius: 12px;
   padding: 8px 12px;
   text-align: center;
   width: 100%;
 }

 body.error-bg .instructions {
   background-color: #424242;
   color: #ffffff;
 }

 /* レベル選択エリア */
 .level-container {
   margin-bottom: 12px;
   display: flex;
   justify-content: center;
   gap: 6px;
   flex-wrap: wrap;
 }

 .level-btn {
   background-color: #ffffff;
   border: 3px solid #000000;
   color: #000000;
   font-size: 0.8rem;
   font-weight: 900;
   padding: 6px 10px;
   border-radius: 10px;
   cursor: pointer;
   box-shadow: 0 3px 0 #000000;
   font-family: 'M PLUS Rounded 1c', sans-serif;
 }

 .level-btn.active {
   background-color: #ffde59;
   transform: translateY(2px);
   box-shadow: 0 1px 0 #000000;
 }

 /* 箱舟エリア */
 .ark-wrapper {
   position: relative;
   width: 100%;
   margin-bottom: 12px;
 }

 .ark-container {
   background-color: #8d6e63;
   border: 4px solid #000000;
   border-radius: 16px;
   padding: 10px;
   box-shadow: 4px 4px 0px #000000;
   transition: transform 2s ease, opacity 2s ease;
 }

 .ark-container.sinking {
   transform: translateY(150px) rotate(15deg);
   opacity: 0.2;
 }

 .ark-title {
   color: #fff;
   font-size: 0.95rem;
   font-weight: 900;
   margin-bottom: 8px;
   text-shadow: 2px 2px 0px #000;
 }

 .ark-grid-scroll {
   max-height: 28vh;
   min-height: 120px;
   overflow-y: auto;
   padding: 4px;
   border-radius: 8px;
   background-color: rgba(0, 0, 0, 0.25);
   border: 2px solid #000;
 }

 .ark-grid-scroll::-webkit-scrollbar {
   width: 8px;
 }

 .ark-grid-scroll::-webkit-scrollbar-thumb {
   background: #ffde59;
   border-radius: 4px;
   border: 2px solid #000;
 }

 .ark-grid {
   display: grid;
   grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
   gap: 6px;
 }

 .ark-card {
   background-color: #ffffff;
   border: 2.5px solid #000000;
   border-radius: 10px;
   padding: 4px 2px;
   font-size: 0.8rem;
   text-align: center;
   color: #333;
   font-weight: 900;
 }

 .ark-card .emoji {
   font-size: 1.4rem;
   display: block;
   line-height: 1.1;
 }

 .animal-name {
   font-weight: 900;
   margin-top: 2px;
   font-size: 0.75rem;
   white-space: nowrap;
   overflow: hidden;
   text-overflow: ellipsis;

   font-size: 0.7rem;
   font-weight: 900;

   justify-content: center;

 .gender-male-on {

   border-radius: 6px;
   border: 1.5px solid #000;
 }

 .gender-female-on {
   color: #ffffff;
   background-color: #ab47bc;
   padding: 1px 4px;
   border-radius: 6px;

 }

 .gender-off {

 }

 .count-text {

   0% { transform: scale(0.8); opacity: 0; }
   100% { transform: scale(1); opacity: 1; }
 }

 /* ステージ (訪問カード) */
 .stage {
   height: 105px;
   position: relative;
   width: 100%;
   max-width: 320px;
   margin: 0 auto 10px auto;
   display: flex;
   justify-content: center;
   align-items: center;

 .visitor-card {
   background-color: #ffffff;
   border: 4px solid #000000;
   border-radius: 16px;
   width: 190px;
   padding: 8px;
   box-shadow: 4px 4px 0px #000000;
   position: absolute;
   transition: all 0.3s ease;
   text-align: center;
 }

 .visitor-card.walk-in { animation: slideIn 0.3s forwards; }
 .visitor-card.board-in { animation: moveToArk 0.4s forwards; }
 .visitor-card.walk-out { animation: slideOut 0.4s forwards; }

 @keyframes slideIn {
   0% { transform: translateX(200px); opacity: 0; }
   100% { transform: translateX(0); opacity: 1; }
 }

 @keyframes moveToArk {
   0% { transform: translateY(0) scale(1); opacity: 1; }
   100% { transform: translateY(-120px) scale(0.2); opacity: 0; }
 }

 @keyframes slideOut {
   0% { transform: translateX(0); opacity: 1; }
   100% { transform: translateX(-200px); opacity: 0; }

 // --- 効果音機能 (Web Audio API) ---
 const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

 function playSound(type) {
  if (audioCtx.state === 'suspended') {
   audioCtx.resume();
  }

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  const now = audioCtx.currentTime;

  if (type === 'appear') {
   osc.type = 'sine';
   osc.frequency.setValueAtTime(300, now);
   osc.frequency.exponentialRampToValueAtTime(600, now + 0.08);
   gain.gain.setValueAtTime(0.3, now);
   gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
   osc.start(now);
   osc.stop(now + 0.08);

  } else if (type === 'board') {
   osc.type = 'triangle';
   osc.frequency.setValueAtTime(523.25, now);
   osc.frequency.setValueAtTime(659.25, now + 0.08);
   osc.frequency.setValueAtTime(783.99, now + 0.16);
   gain.gain.setValueAtTime(0.3, now);
   gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
   osc.start(now);
   osc.stop(now + 0.3);

  } else if (type === 'reject') {
   osc.type = 'sine';
   osc.frequency.setValueAtTime(400, now);
   osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
   gain.gain.setValueAtTime(0.2, now);
   gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
   osc.start(now);
   osc.stop(now + 0.12);

  } else if (type === 'win') {
   const notes = [523.25, 659.25, 783.99, 1046.50];
   notes.forEach((freq, idx) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'triangle';
    o.connect(g);
    g.connect(audioCtx.destination);
    const startTime = now + idx * 0.12;
    o.frequency.setValueAtTime(freq, startTime);
    g.gain.setValueAtTime(0.3, startTime);
    g.gain.linearRampToValueAtTime(0.01, startTime + 0.4);
    o.start(startTime);
    o.stop(startTime + 0.4);
   });

  } else if (type === 'lose') {
   osc.type = 'sawtooth';
   osc.frequency.setValueAtTime(150, now);
   osc.frequency.linearRampToValueAtTime(40, now + 0.8);
   gain.gain.setValueAtTime(0.4, now);
   gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
   osc.start(now);
   osc.stop(now + 0.8);
  }
 }

 let currentLevel = 1;
 let activeAnimals = [];
 let totalTarget = 0;

 let arkState = {};
 let currentVisitor = null;
 let onboardCount = 0;
 let isGameOver = false;
 let isGameStarted = false;
 let isAnimating = false;

 let startTime = null;
 let currentLang = 'ja';

 function setLanguage(lang) {
  currentLang = lang;
  ['ja', 'kana', 'en'].forEach(l => {
   const btn = document.getElementById(`lang-${l}`);
   if (l === lang) btn.classList.add('active');
   else btn.classList.remove('active');
  });

  updateTexts();
  renderArk();
  if (currentVisitor) {
   updateVisitorCardName();
  }
 }

 function getAnimalDisplayName(animal) {
  if (currentLang === 'en') return animal.enName;
  if (currentLang === 'kana') return animal.kanaName;
  return animal.name;
 }

 function getGenderText(gender) {
  if (gender === 'none') return "";
  if (gender === 'male') {
   if (currentLang === 'en') return "♂ Male";
   if (currentLang === 'kana') return "おす";
   return "♂ (オス)";
  } else {
   if (currentLang === 'en') return "♀ Female";
   if (currentLang === 'kana') return "めす";
   return "♀ (メス)";
  }
 }

 function updateVisitorCardName() {
  if (!currentVisitor) return;
  const animalName = getAnimalDisplayName(currentVisitor);
  const genderSymbol = getGenderText(currentVisitor.gender);
  document.getElementById("v-name").textContent = genderSymbol ? `${animalName} ${genderSymbol}` : animalName;
 }

 function updateTexts() {
  if (currentLang === 'en') {
   document.getElementById("ui-title").textContent = "ARK GAME";
   document.getElementById("lvl-1").textContent = "Level 1 (4 types)";
   document.getElementById("lvl-2").textContent = "Level 2 (8 types)";
   document.getElementById("lvl-3").textContent = "Level 3 (16 types)";
   document.getElementById("lvl-4").textContent = "Noah Level (49 types)";
   
   document.getElementById("ui-instructions").innerHTML = 
   `Animals arrive one by one!<br>` +
   `Tap <strong>"Board"</strong> if there's room, or <strong>"Reject"</strong> if capacity is full!<br>` +
   `<small id="clean-note">⚠️ Always <strong>Reject</strong> Nephilim! ✨ Clean animals: <strong>3 Males / 4 Females</strong>.</small>`;
   
   document.getElementById("btn-board").textContent = "🚢 Board";
   document.getElementById("btn-reject").textContent = "👋 Reject";
   document.getElementById("btn-start").textContent = "▶️ Start!";
   document.getElementById("btn-reset").textContent = "🔄 Play Again";
   
   if (!isGameStarted && !isGameOver) {
    document.getElementById("message").textContent = "Press 'Start!' to begin!";
   }

  } else if (currentLang === 'kana') {
   document.getElementById("ui-title").textContent = "のあの はこぶね";
   document.getElementById("lvl-1").textContent = "れべる1 (4しゅ)";
   document.getElementById("lvl-2").textContent = "れべる2 (8しゅ)";
   document.getElementById("lvl-3").textContent = "れべる3 (16しゅ)";
   document.getElementById("lvl-4").textContent = "れべる のあ (49しゅ)";
   
   document.getElementById("ui-instructions").innerHTML = 
   `どうぶつが 1ひきずつ やってくるよ！<br>` +
   `はこぶねに まだのれるなら<strong>「のせる」</strong>、もう いっぱいなら<strong>「かえってもらう」</strong>を えらぼう！<br>` +
   `<small id="clean-note">⚠️ <strong>ねふぃりむ</strong>が きたら かならず <strong>「かえってもらう」</strong>を えらんでね！</small>`;
   
   document.getElementById("btn-board").textContent = "🚢 のせる";
   document.getElementById("btn-reject").textContent = "👋 かえってもらう";
   document.getElementById("btn-start").textContent = "▶️ すたーと！";
   document.getElementById("btn-reset").textContent = "🔄 もういちど あそぶ";
   
   if (!isGameStarted && !isGameOver) {
    document.getElementById("message").textContent = "「すたーと！」を おしてね！";
   }

  } else {
   document.getElementById("ui-title").textContent = "ノアの箱舟ゲーム";
   document.getElementById("lvl-1").textContent = "レベル1 (4種)";
   document.getElementById("lvl-2").textContent = "レベル2 (8種)";
   document.getElementById("lvl-3").textContent = "レベル3 (16種)";
   document.getElementById("lvl-4").textContent = "レベルノア (49種)";

   document.getElementById("ui-instructions").innerHTML = 
   `動物が1匹ずつやってくるよ！<br>` +
   `箱舟にまだ乗れるなら<strong>「乗せる」</strong>、もう定員がいっぱいなら<strong>「帰ってもらう」</strong>を選ぼう！<br>` +
   `<small id="clean-note">⚠️ <strong>ネフィリム</strong>が来たらどんなときも<strong>「帰ってもらう」</strong>を選ぼう！</small>`;

   document.getElementById("btn-board").textContent = "🚢 乗せる";
   document.getElementById("btn-reject").textContent = "👋 帰ってもらう";
   document.getElementById("btn-start").textContent = "▶️ スタート！";
   document.getElementById("btn-reset").textContent = "🔄 最初から遊ぶ";

   if (!isGameStarted && !isGameOver) {
    document.getElementById("message").textContent = "「スタート！」を押してゲームを開始しよう！";
   }
  }
 }

 function changeLevel(level) {
  currentLevel = level;

  document.querySelectorAll(".level-btn").forEach((btn, idx) => {
   if (idx + 1 === level) {
    btn.classList.add("active");
   } else {
    btn.classList.remove("active");
   }
  });

  resetGame();
 }

 function resetGame() {
  onboardCount = 0;
  isGameOver = false;
  isGameStarted = false;
  isAnimating = false;

  if (currentLevel === 1) {
   activeAnimals = allAnimals.slice(0, 4);
  } else if (currentLevel === 2) {
   activeAnimals = allAnimals.slice(0, 8);
  } else if (currentLevel === 3) {
   activeAnimals = allAnimals.slice(0, 16);
  } else {
   activeAnimals = [...allAnimals];
  }

  // 配列の位置をランダムにシャッフル
  for (let i = activeAnimals.length - 1; i > 0; i--) {
   const j = Math.floor(Math.random() * (i + 1));
   [activeAnimals[i], activeAnimals[j]] = [activeAnimals[j], activeAnimals[i]];
  }

  totalTarget = activeAnimals.reduce((sum, a) => a.isForbidden ? sum : sum + a.maxMale + a.maxFemale, 0);

  document.body.className = "";
  document.getElementById("rainbow").style.display = "none";
  document.getElementById("ark-container").className = "ark-container";
  document.getElementById("max-count").textContent = totalTarget;

  arkState = {};
  activeAnimals.forEach(a => {
   arkState[a.id] = { male: 0, female: 0, maxMale: a.maxMale, maxFemale: a.maxFemale, isForbidden: a.isForbidden };
  });

  document.getElementById("count").textContent = "0";
  document.getElementById("clear-time-display").innerHTML = ""; 

  document.getElementById("btn-start").style.display = "inline-block";
  enableButtons(false);

  document.getElementById("v-emoji").textContent = "❓";
  document.getElementById("v-name").textContent = "...";

  updateTexts();
  renderArk();
 }

 function startGame() {
  isGameStarted = true;
  startTime = Date.now();
  document.getElementById("btn-start").style.display = "none";
  enableButtons(true);

  let startMsg = "";
  const lvlName = currentLevel === 4 ? (currentLang === 'en' ? 'Noah' : (currentLang === 'kana' ? 'のあ' : 'ノア')) : currentLevel;

  if (currentLang === 'en') startMsg = `Level ${lvlName} Start!`;
  else if (currentLang === 'kana') startMsg = `れべる ${lvlName} すたーと！`;
  else startMsg = `レベル${lvlName} スタート！`;

  document.getElementById("message").textContent = startMsg;
  document.getElementById("message").className = "message";

  nextVisitor();
 }

 function renderArk() {
  const grid = document.getElementById("ark-grid");
  grid.innerHTML = "";

  let arkTitleText = "🚢 箱舟の中（乗せた数: ";
  let arkTitleSuffix = "匹）";
  if (currentLang === 'en') {
   arkTitleText = "🚢 Inside Ark (Boarded: ";
   arkTitleSuffix = ")";
  } else if (currentLang === 'kana') {
   arkTitleText = "🚢 はこぶねの なか（のせたかず: ";
   arkTitleSuffix = "ひき）";
  }

  document.getElementById("ui-ark-title").innerHTML = `${arkTitleText}<span id="count">${onboardCount}</span> / <span id="max-count">${totalTarget}</span>${arkTitleSuffix}`;

  activeAnimals.forEach(a => {
   if (a.isForbidden) return;

   const state = arkState[a.id];
   const card = document.createElement("div");
   card.className = "ark-card";

   const displayName = getAnimalDisplayName(a);

   let maleText = currentLang === 'en' ? "M" : (currentLang === 'kana' ? "おす" : "♂");
   let femaleText = currentLang === 'en' ? "F" : (currentLang === 'kana' ? "めす" : "♀");

   let maleHtml = "";
   let femaleHtml = "";

   if (a.maxMale === 1) {
    maleHtml = state.male > 0 ? `<span class="gender-male-on">${maleText}</span>` : `<span class="gender-off">${maleText}</span>`;
   } else {
    maleHtml = state.male > 0 ? `<span class="gender-male-on count-text">${maleText}${state.male}/${a.maxMale}</span>` : `<span class="gender-off count-text">${maleText}0/${a.maxMale}</span>`;
   }

   if (a.maxFemale === 1) {
    femaleHtml = state.female > 0 ? `<span class="gender-female-on">${femaleText}</span>` : `<span class="gender-off">${femaleText}</span>`;
   } else {
    femaleHtml = state.female > 0 ? `<span class="gender-female-on count-text">${femaleText}${state.female}/${a.maxFemale}</span>` : `<span class="gender-off count-text">${femaleText}0/${a.maxFemale}</span>`;
   }

   card.innerHTML = `
    <span class="emoji">${a.emoji}</span>
    <div class="animal-name">${displayName}</div>
    <div class="genders">${maleHtml} ${femaleHtml}</div>
   `;
   grid.appendChild(card);
  });
 }

 function nextVisitor() {
  if (isGameOver || !isGameStarted) return;

  const candidates = [];

  activeAnimals.forEach(animal => {
   if (animal.isForbidden) {
    candidates.push({ animal, gender: "none", weight: 3 });
   } else {
    ["male", "female"].forEach(gender => {
     const currentAmount = arkState[animal.id][gender];
     const maxAmount = gender === "male" ? animal.maxMale : animal.maxFemale;
     
     let weight = 0;
     if (currentAmount < maxAmount) {
      weight = (maxAmount - currentAmount) * 10;
     } else {
      weight = 1;
     }

     candidates.push({ animal, gender, weight });
    });
   }
  });

  const totalWeight = candidates.reduce((sum, c) => sum + c.weight, 0);
  let randomNum = Math.random() * totalWeight;
  let selectedCandidate = candidates[0];

  for (const candidate of candidates) {
   if (randomNum < candidate.weight) {
    selectedCandidate = candidate;
    break;
   }
   randomNum -= candidate.weight;
  }

  const selectedAnimal = selectedCandidate.animal;
  const selectedGender = selectedCandidate.gender;

  currentVisitor = {
   ...selectedAnimal,
   gender: selectedGender
  };

  const card = document.getElementById("v-card");
  card.className = "visitor-card"; 
  void card.offsetWidth;

  document.getElementById("v-emoji").textContent = currentVisitor.emoji;
  updateVisitorCardName();
  card.classList.add("walk-in");

  playSound('appear');
  isAnimating = false;
 }

 function handleChoice(playerWantsToBoard) {
  if (isGameOver || !isGameStarted || isAnimating || !currentVisitor) return;

  isAnimating = true;
  const animalId = currentVisitor.id;
  const gender = currentVisitor.gender;
  const isForbidden = currentVisitor.isForbidden;

  const currentAmount = isForbidden ? 0 : arkState[animalId][gender];
  const maxAmount = isForbidden ? 0 : (gender === "male" ? arkState[animalId].maxMale : arkState[animalId].maxFemale);
  const isFull = isForbidden || (currentAmount >= maxAmount);

  const msgEl = document.getElementById("message");
  const card = document.getElementById("v-card");
  const animalName = getAnimalDisplayName(currentVisitor);
  const genderText = getGenderText(gender);

  if (playerWantsToBoard) {
   if (isFull) {
    card.classList.add("board-in");
    playSound('lose');
    
    if (isForbidden) {
     if (currentLang === 'en') msgEl.textContent = `Failed! You cannot board ${animalName}!`;
     else if (currentLang === 'kana') msgEl.textContent = `しっぱい！ ${animalName}は のせられません！`;
     else msgEl.textContent = `失敗！ ${animalName}は乗せてはいけません！`;
    } else {
     if (currentLang === 'en') msgEl.textContent = `Failed! ${animalName} (${genderText}) is already full!`;
     else if (currentLang === 'kana') msgEl.textContent = `しっぱい！ ${animalName}の ${genderText}は もう いっぱいです！`;
     else msgEl.textContent = `失敗！ ${animalName}の${genderText}はもう定員がいっぱいです！`;
    }

    msgEl.className = "message error";
    endGame(false);
   } else {
    card.classList.add("board-in");
    playSound('board');
    setTimeout(() => {
     arkState[animalId][gender]++;
     onboardCount++;
     document.getElementById("count").textContent = onboardCount;

     const nowCount = arkState[animalId][gender];
     let countInfo = "";
     if (maxAmount > 1) {
      if (currentLang === 'en') countInfo = ` (${nowCount}/${maxAmount})`;
      else if (currentLang === 'kana') countInfo = ` (${nowCount}/${maxAmount}ひきめ)`;
      else countInfo = ` (${nowCount}/${maxAmount}匹目)`;
     }

     if (currentLang === 'en') msgEl.textContent = `⭕ Boarded ${animalName} (${genderText})${countInfo}!`;
     else if (currentLang === 'kana') msgEl.textContent = `⭕ ${animalName} ${genderText} ${countInfo} を のせました！`;
     else msgEl.textContent = `⭕ ${animalName} ${genderText} ${countInfo} を乗せました！`;

     msgEl.className = "message success";

     renderArk();

     if (onboardCount === totalTarget) {
      if (currentLang === 'en') msgEl.textContent = "🎉 Congratulations! All animals are aboard! 🎉";
      else if (currentLang === 'kana') msgEl.textContent = "🎉 おめでとう！ ぜんぶの どうぶつを のせられたよ！ 🎉";
      else msgEl.textContent = "🎉 おめでとう！すべての動物を乗せられました！ 🎉";

      msgEl.className = "message success";
      endGame(true);
     } else {
      nextVisitor();
     }
    }, 400);
   }
  } else {
   if (isFull) {
    card.classList.add("walk-out");
    playSound('reject');
    setTimeout(() => {
     if (isForbidden) {
      if (currentLang === 'en') msgEl.textContent = `⭕ Successfully turned away ${animalName}!`;
      else if (currentLang === 'kana') msgEl.textContent = `⭕ ${animalName}に かえってもらいました！`;
      else msgEl.textContent = `⭕ ${animalName}に無事帰ってもらいました！`;
     } else {
      if (currentLang === 'en') msgEl.textContent = `⭕ Turned away ${animalName} (${genderText}) as capacity was full.`;
      else if (currentLang === 'kana') msgEl.textContent = `⭕ ${animalName} ${genderText} は いっぱいだったので かえってもらいました。`;
      else msgEl.textContent = `⭕ ${animalName} ${genderText} は定員がいっぱいだったので帰ってもらいました。`;
     }

     msgEl.className = "message success";
     nextVisitor();
    }, 400);
   } else {
    card.classList.add("walk-out");
    playSound('lose');
    
    if (currentLang === 'en') msgEl.textContent = `Failed! ${animalName} (${genderText}) still had room!`;
    else if (currentLang === 'kana') msgEl.textContent = `しっぱい！ ${animalName}の ${genderText}は まだ のせられました！`;
    else msgEl.textContent = `失敗！ ${animalName}の${genderText}はまだ乗せられました！`;

    msgEl.className = "message error";
    endGame(false);
   }
  }
 }

 function endGame(isWin) {
  isGameOver = true;
  enableButtons(false);

  if (isWin) {
   playSound('win');
   document.body.className = "success-bg";
   document.getElementById("rainbow").style.display = "block";

   const elapsedTime = ((Date.now() - startTime) / 1000).toFixed(1);
   const minutes = Math.floor(elapsedTime / 60);
   const seconds = (elapsedTime % 60).toFixed(1);
   
   let timeString = "";
   if (currentLang === 'en') {
    timeString = minutes > 0 ? `${minutes}m ${seconds}s` : `${seconds}s`;
   } else if (currentLang === 'kana') {
    timeString = minutes > 0 ? `${minutes}ふん${seconds}びょう` : `${seconds}びょう`;
   } else {
    timeString = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;
   }

   let clearLabel = "⏱️ クリアタイム";
   if (currentLang === 'en') clearLabel = "⏱️ Clear Time";
   else if (currentLang === 'kana') clearLabel = "⏱️ くりあたいむ";

   const timeDisplay = document.getElementById("clear-time-display");
   timeDisplay.innerHTML = `<div class="clear-time">${clearLabel}: ${timeString}</div>`;
  } else {
   document.body.className = "error-bg";
   setTimeout(() => {
    document.getElementById("ark-container").classList.add("sinking");
   }, 300);
  }
 }

 function enableButtons(enabled) {
  document.getElementById("btn-board").disabled = !enabled;
  document.getElementById("btn-reject").disabled = !enabled;
 }

 resetGame();
 </script>
