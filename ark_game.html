<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ARK GAME - BIBLE TASTE GAMES</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/ark_game.css">
</head>
<body class="page-ark">

  <div class="rainbow" id="rainbow"></div>

  <main class="card main-card">

    <a href="index.html" class="btn btn--pink back-btn">👈 ゲーム一覧に戻る</a>

    <h1 class="retro-title" data-i18n="title">ARK GAME</h1>

    <!-- 言語切替（js/i18n.js が生成） -->
    <div id="lang-switch" class="lang-switch-wrap"></div>

    <!-- レベル選択 -->
    <div class="level-container" id="level-container">
      <button type="button" class="level-btn active" data-level="1" data-i18n="lvl1"></button>
      <button type="button" class="level-btn" data-level="2" data-i18n="lvl2"></button>
      <button type="button" class="level-btn" data-level="3" data-i18n="lvl3"></button>
      <button type="button" class="level-btn" data-level="4" data-i18n="lvl4"></button>
    </div>

    <p class="instructions" data-i18n-html="instructions"></p>

    <!-- 箱舟 -->
    <div class="ark-container" id="ark-container">
      <div class="ark-title" id="ark-title"></div>
      <div class="ark-grid-scroll">
        <div class="ark-grid" id="ark-grid"></div>
      </div>
    </div>

    <div class="message" id="message"></div>
    <div id="clear-time-display"></div>

    <!-- 訪問中の動物 -->
    <div class="stage">
      <div class="visitor-card" id="v-card">
        <div class="visitor-emoji" id="v-emoji">❓</div>
        <div class="visitor-name" id="v-name">...</div>
      </div>
    </div>

    <button type="button" class="btn btn--yellow btn-start" id="btn-start" data-i18n="start"></button>

    <div class="action-btns">
      <button type="button" class="btn btn--green" id="btn-board" data-i18n="board"></button>
      <button type="button" class="btn btn--red" id="btn-reject" data-i18n="reject"></button>
    </div>

    <button type="button" class="btn btn--cyan btn-reset" id="btn-reset" data-i18n="reset"></button>

  </main>

  <footer class="site-footer">
    <p>&copy; BIBLE TASTE GAMES All Rights Reserved.</p>
  </footer>

  <script src="js/audio.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/ark_game.js"></script>
</body>
</html>
