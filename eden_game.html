<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エデンの園ゲーム - BIBLE TASTE GAMES</title>
  <!-- レトロゲーム風フォント（Google Fonts） -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=M+PLUS+Rounded+1c:wght@700;900&display=swap" rel="stylesheet">
  
  <style>
    /* 全体のスタイル設定（ポータルサイトと統一） */
    body {
      background-color: #1b153a; /* ポップな濃いパープル */
      color: #ffffff;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
      background-image: 
        radial-gradient(#392c6e 15%, transparent 16%),
        radial-gradient(#392c6e 15%, transparent 16%);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      user-select: none;
    }

    /* ヘッダー・タイトル */
    header {
      margin-top: 25px;
      margin-bottom: 15px;
      text-align: center;
    }

    h1 {
      font-family: 'Press Start 2P', cursive, sans-serif;
      font-size: 1.8rem;
      color: #ffde59; /* レトロイエロー */
      text-shadow: 
        3px 3px 0px #ff3131, 
        6px 6px 0px #000000;
      letter-spacing: 2px;
      margin: 0 0 10px 0;
      line-height: 1.3;
    }

    .subtitle {
      background-color: #00e676;
      color: #000000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      box-shadow: 0 4px 0 #008c43;
      font-size: 0.95rem;
    }

    /* ゲームコンテナ */
    .game-wrapper {
      width: 90%;
      max-width: 500px;
      background: #ffffff;
      color: #333333;
      border: 5px solid #000000;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 8px 8px 0px #000000;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    /* ステータスバー */
    .status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      font-size: 1.1rem;
      font-weight: 900;
      background: #ffde59;
      color: #000000;
      padding: 10px 15px;
      border: 4px solid #000000;
      border-radius: 12px;
      box-sizing: border-box;
      box-shadow: 0 4px 0 #000000;
    }

    /* ゲーム画面（キャンバス） */
    canvas {
      width: 100%;
      max-width: 460px;
      height: 320px;
      background-color: #a2e8dd; /* エデンの明るいグリーン水色背景 */
      border: 4px solid #000000;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      touch-action: manipulation;
    }

    /* 操作ボタンエリア */
    .controls {
      width: 100%;
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    /* ポップなゲームボタン */
    .game-btn {
      flex: 1;
      font-family: 'M PLUS Rounded 1c', sans-serif;
      font-weight: 900;
      font-size: 1.1rem;
      padding: 12px 0;
      border: 4px solid #000000;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 0 #000000;
      transition: all 0.1s;
      color: #ffffff;
      text-align: center;
      text-decoration: none;
    }

    .game-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #000000;
    }

    /* ボタンカラー */
    .btn-expel { background-color: #ff5757; }  /* 追い返す（レッド） */
    .btn-welcome { background-color: #00e676; color: #000000; } /* 入れる（グリーン） */
    .btn-back { 
      background-color: #00c2cb; 
      max-width: 220px;
      font-size: 0.95rem;
      padding: 10px 0;
      margin-top: 5px;
    }

    /* フッター */
    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 0.8rem;
      color: #a0a0a0;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>EDEN GAME</h1>
    <div class="subtitle">👼 天使になってエデンを守ろう！ 👼</div>
  </header>

  <main class="game-wrapper">
    <!-- ステータス表示 -->
    <div class="status-bar">
      <span>SCORE: <span id="score">0</span></span>
      <span>TIME: <span id="time">30</span>s</span>
    </div>

    <!-- ゲーム画面（Canvas） -->
    <canvas id="gameCanvas" width="460" height="320"></canvas>

    <!-- 操作用UI -->
    <div class="controls" id="action-controls">
      <button class="game-btn btn-welcome" id="btn-welcome">⭕ 入れる</button>
      <button class="game-btn btn-expel" id="btn-expel">❌ 追い返す</button>
    </div>

    <!-- メニューに戻るボタン -->
    <a href="index.html" class="game-btn btn-back">⬅ メニューにもどる</a>
  </main>

  <footer>
    <p>&copy; BIBLE TASTE GAMES All Rights Reserved.</p>
  </footer>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const btnWelcome = document.getElementById('btn-welcome');
    const btnExpel = document.getElementById('btn-expel');

    // 登場キャラクターリスト（人間＝追い返す、動物＝入れる）
    const characters = [
      { name: 'アダム', emoji: '👨', isHuman: true, message: '入ろうとしている！' },
      { name: 'イブ', emoji: '👩', isHuman: true, message: '入ろうとしている！' },
      { name: 'ヘビ', emoji: '🐍', isHuman: true, message: 'そそのかそうとしている！' }, // 人間側に分類（追い返す対象）
      { name: 'ひつじ', emoji: '🐑', isHuman: false, message: 'あそびに来たよ！' },
      { name: 'ライオン', emoji: '🦁', isHuman: false, message: 'あそびに来たよ！' },
      { name: 'ハト', emoji: '🕊️', isHuman: false, message: 'あそびに来たよ！' },
      { name: 'うさぎ', emoji: '🐰', isHuman: false, message: 'あそびに来たよ！' }
    ];

    let currentGuest = null;
    let score = 0;
    let timeLeft = 30;
    let gameInterval = null;
    let isPlaying = false;
    let feedbackMessage = '';
    let feedbackColor = '';

    // ゲーム開始
    function startGame() {
      score = 0;
      timeLeft = 30;
      isPlaying = true;
      scoreEl.textContent = score;
      timeEl.textContent = timeLeft;
      
      nextGuest();

      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        timeLeft--;
        timeEl.textContent = timeLeft;

        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    // 次のキャラクターを読み込み
    function nextGuest() {
      const randomIndex = Math.floor(Math.random() * characters.length);
      currentGuest = characters[randomIndex];
      draw();
    }

    // 判定処理
    function handleChoice(action) {
      if (!isPlaying) {
        startGame();
        return;
      }

      // action: 'welcome' (入れる) or 'expel' (追い返す)
      if ((action === 'expel' && currentGuest.isHuman) || (action === 'welcome' && !currentGuest.isHuman)) {
        // 正解！
        score += 100;
        feedbackMessage = 'セイカイ！ 判決成功！';
        feedbackColor = '#00c2cb';
      } else {
        // 不正解
        score = Math.max(0, score - 50);
        feedbackMessage = 'ザンネン... 判決ミス！';
        feedbackColor = '#ff3131';
      }

      scoreEl.textContent = score;
      nextGuest();
    }

    // Canvas描画処理
    function draw() {
      // 背景（エデンの園風グラデーション）
      ctx.fillStyle = '#a2e8dd';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地面（芝生）
      ctx.fillStyle = '#51cf66';
      ctx.beginPath();
      ctx.ellipse(230, 290, 260, 60, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#000000';
      ctx.stroke();

      // エデンの木（背景の装飾）
      ctx.font = '50px sans-serif';
      ctx.fillText('🌳', 40, 210);
      ctx.fillText('🍎', 60, 160);
      ctx.fillText('🌳', 360, 210);

      if (!isPlaying && timeLeft === 30) {
        // スタート画面
        ctx.fillStyle = '#000000';
        ctx.font = '900 22px "M PLUS Rounded 1c"';
        ctx.textAlign = 'center';
        ctx.fillText('人間とヘビは ❌ 追い返そう！', canvas.width / 2, 120);
        ctx.fillText('動物たちは ⭕ 入れてあげよう！', canvas.width / 2, 160);
        
        ctx.fillStyle = '#ff3131';
        ctx.font = '900 20px "M PLUS Rounded 1c"';
        ctx.fillText('ボタンを押してスタート！', canvas.width / 2, 230);
        return;
      }

      if (!isPlaying && timeLeft <= 0) {
        // タイムアップ画面
        ctx.fillStyle = '#000000';
        ctx.font = '900 32px "M PLUS Rounded 1c"';
        ctx.textAlign = 'center';
        ctx.fillText('TIME UP!', canvas.width / 2, 120);

        ctx.fillStyle = '#ff5757';
        ctx.font = '900 26px "M PLUS Rounded 1c"';
        ctx.fillText(`SCORE: ${score}`, canvas.width / 2, 180);

        ctx.fillStyle = '#2b2b2b';
        ctx.font = '900 18px "M PLUS Rounded 1c"';
        ctx.fillText('ボタンを押してもう一度あそぶ', canvas.width / 2, 230);
        return;
      }

      // 天使（判定者）の表示
      ctx.font = '40px sans-serif';
      ctx.fillText('👼', 230 - 140, 90);

      // 登場キャラクターの表示
      ctx.font = '90px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(currentGuest.emoji, canvas.width / 2, 210);

      // キャラクター名吹き出し
      ctx.fillStyle = '#ffffff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(110, 30, 240, 45, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#000000';
      ctx.font = '900 18px "M PLUS Rounded 1c"';
      ctx.fillText(`${currentGuest.name} が ${currentGuest.message}`, canvas.width / 2, 60);

      // フィードバック表示
      if (feedbackMessage) {
        ctx.fillStyle = feedbackColor;
        ctx.font = '900 16px "M PLUS Rounded 1c"';
        ctx.fillText(feedbackMessage, canvas.width / 2, 275);
      }
    }

    // ゲーム終了
    function endGame() {
      isPlaying = false;
      clearInterval(gameInterval);
      draw();
    }

    // イベントリスナー
    btnWelcome.addEventListener('click', () => handleChoice('welcome'));
    btnExpel.addEventListener('click', () => handleChoice('expel'));

    // 初期化描画
    draw();
  </script>

</body>
</html>
