<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- ドット柄パターン -->
    <pattern id="dot-pattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#392c6e" />
      <circle cx="6" cy="6" r="1" fill="#392c6e" />
    </pattern>
  </defs>

  <!-- ベース背景（1b153a） -->
  <rect width="64" height="64" rx="14" fill="#1b153a" />
  <rect width="64" height="64" rx="14" fill="url(#dot-pattern)" />

  <!-- 外枠（カード風ブラックフレーム） -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#000000" stroke-width="4" />

  <!-- 『B』の文字（立体シャドウ＋レトロイエロー） -->
  <!-- 黒シャドウ（落ち影） -->
  <text x="35" y="49" 
        font-family="'M PLUS Rounded 1c', 'Press Start 2P', sans-serif" 
        font-weight="900" 
        font-size="44" 
        text-anchor="middle" 
        fill="#000000">B</text>

  <!-- 赤シャドウ（立体部分） -->
  <text x="33" y="47" 
        font-family="'M PLUS Rounded 1c', 'Press Start 2P', sans-serif" 
        font-weight="900" 
        font-size="44" 
        text-anchor="middle" 
        fill="#ff3131">B</text>

  <!-- メイン文字（レトロイエロー） -->
  <text x="30" y="44" 
        font-family="'M PLUS Rounded 1c', 'Press Start 2P', sans-serif" 
        font-weight="900" 
        font-size="44" 
        text-anchor="middle" 
        fill="#ffde59">B</text>
</svg>
