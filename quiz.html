<!DOCTYPE html>
<html lang="ja">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>クイズチャレンジ</title>
   <style>
      :root {
         --bg-color: #eef2f5;
         --card-bg: #ffffff;
         --primary-color: #ff6b6b;
         --secondary-color: #4ecdc4;
         --accent-color: #ffe66d;
         --text-color: #2c3e50;
         --anim-speed: 0.5s;
         --cell-size: 55px;
      }

      body {
         font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
         background-color: var(--bg-color);
         color: var(--text-color);
         margin: 0;
         padding: 16px;
         display: flex;
         flex-direction: column;
         align-items: center;
         min-height: 100vh;
         box-sizing: border-box;
      }

      header {
         text-align: center;
         margin-bottom: 20px;
         width: 100%;
      }

      header h1 {
         font-size: clamp(1.5rem, 5vw, 2.4rem);
         color: var(--primary-color);
         margin: 0;
         text-shadow: 2px 2px 0px #fff;
         word-break: break-word;
      }

      .quiz-card {
         background: var(--card-bg);
         border-radius: 24px;
         box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
         width: 100%;
         max-width: 800px;
         padding: 28px;
         box-sizing: border-box;
         position: relative;
         overflow: hidden;
      }

      /* ホーム画面用スタイル */
      .home-grid {
         display: grid;
         grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
         gap: 20px;
         margin-top: 15px;
      }

      .theme-card {
         background: #fff;
         border: 2px solid #e2e8f0;
         border-radius: 20px;
         padding: 18px;
         text-align: center;
         cursor: pointer;
         transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
         display: flex;
         flex-direction: column;
         justify-content: space-between;
         box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      }

      .theme-card:active,
      .theme-card:hover {
         transform: translateY(-4px);
         border-color: var(--secondary-color);
         box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      }

      .theme-card img {
         width: 100%;
         height: 140px;
         object-fit: cover;
         border-radius: 12px;
         margin-bottom: 12px;
      }

      .theme-title {
         font-size: 1.15rem;
         font-weight: bold;
         color: var(--text-color);
         margin-bottom: 8px;
         line-height: 1.4;
      }

      .theme-desc {
         font-size: 0.9rem;
         color: #64748b;
         margin-bottom: 16px;
         flex-grow: 1;
      }

      .btn-start-theme {
         background: var(--primary-color);
         color: white;
         border: none;
         padding: 10px;
         border-radius: 12px;
         font-weight: bold;
         font-size: 1rem;
      }

      .nav-bar {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-bottom: 20px;
         gap: 8px;
         flex-wrap: wrap;
      }

      .nav-btn {
         background: var(--secondary-color);
         color: white;
         border: none;
         padding: 8px 14px;
         border-radius: 14px;
         font-weight: bold;
         font-size: 0.95rem;
         cursor: pointer;
         transition: transform 0.1s;
         flex-shrink: 0;
         touch-action: manipulation;
      }

      .nav-btn.home-btn {
         background: #64748b;
      }

      .nav-btn:disabled {
         opacity: 0.4;
         cursor: not-allowed;
      }

      select.quiz-select {
         padding: 8px;
         border-radius: 12px;
         border: 2px solid var(--secondary-color);
         font-size: 0.9rem;
         font-weight: bold;
         outline: none;
         flex: 1;
         min-width: 130px;
         max-width: 100%;
         text-overflow: ellipsis;
      }

      .question-badge {
         display: inline-block;
         background: var(--accent-color);
         color: #854d0e;
         font-weight: bold;
         padding: 4px 12px;
         border-radius: 20px;
         font-size: 0.9rem;
         margin-bottom: 8px;
      }

      .question-title {
         font-size: clamp(1.15rem, 4.2vw, 1.55rem);
         margin-top: 0;
         margin-bottom: 18px;
         word-break: break-word;
         line-height: 1.6;
      }

      .question-image {
         text-align: center;
         margin-bottom: 16px;
      }

      .question-image img {
         max-width: 100%;
         max-height: 250px;
         border-radius: 12px;
         object-fit: cover;
      }

      .bible-read-box {
         background: #fef3c7;
         border: 2px dashed #f59e0b;
         border-radius: 16px;
         padding: 16px;
         margin-bottom: 18px;
         font-size: 1.05rem;
         line-height: 1.6;
      }

      .options-grid {
         display: grid;
         grid-template-columns: repeat(2, 1fr);
         gap: 12px;
         width: 100%;
      }

      .btn-option {
         background: #f8fafc;
         border: 2px solid #cbd5e1;
         border-radius: 16px;
         padding: 12px;
         font-size: clamp(1rem, 3.8vw, 1.2rem);
         font-weight: bold;
         cursor: pointer;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: center;
         word-break: break-word;
         min-height: 60px;
         box-sizing: border-box;
         color: var(--text-color);
         transition: all 0.2s ease;
      }

      .btn-option.selected {
         background-color: #e0f2fe;
         border-color: #0284c7;
         box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3);
      }

      .btn-option img {
         max-width: 100%;
         max-height: 120px;
         border-radius: 8px;
         margin-bottom: 8px;
         object-fit: cover;
      }

      .submit-btn {
         display: block;
         width: 100%;
         background: var(--primary-color);
         color: white;
         border: none;
         padding: 14px;
         border-radius: 16px;
         font-size: 1.2rem;
         font-weight: bold;
         cursor: pointer;
         margin-top: 20px;
         box-shadow: 0 4px 10px rgba(255, 107, 107, 0.3);
      }

      .classify-container {
         display: flex;
         flex-direction: column;
         gap: 16px;
      }

      .drag-items-pool {
         display: flex;
         flex-wrap: wrap;
         gap: 10px;
         padding: 12px;
         background: #f1f5f9;
         border-radius: 12px;
         min-height: 60px;
      }

      .drop-categories {
         display: grid;
         grid-template-columns: repeat(2, 1fr);
         gap: 12px;
      }

      .drop-zone {
         background: #fff;
         border: 2px dashed #94a3b8;
         border-radius: 12px;
         padding: 10px;
         min-height: 120px;
      }

      .drop-zone h4 {
         margin: 0 0 8px 0;
         text-align: center;
         color: #475569;
      }

      .drag-item {
         background: #ffffff;
         border: 2px solid #cbd5e1;
         border-radius: 10px;
         padding: 8px 12px;
         font-weight: bold;
         cursor: grab;
         user-select: none;
         display: inline-flex;
         align-items: center;
         gap: 8px;
         margin: 4px;
      }

      /* 並び替えクイズスタイル */
      .sort-list {
         display: flex;
         flex-direction: column;
         gap: 12px;
         user-select: none;
         touch-action: pan-y;
      }

      .sort-item {
         background: #ffffff;
         border: 2.5px solid #cbd5e1;
         border-radius: 16px;
         padding: 10px 14px;
         display: flex;
         align-items: center;
         gap: 12px;
         font-weight: bold;
         box-shadow: 0 3px 6px rgba(0, 0, 0, 0.04);
         transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
         touch-action: none;
      }

      .sort-item.dragging {
         opacity: 0.85;
         transform: scale(1.02);
         border-color: var(--secondary-color);
         box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
         z-index: 10;
      }

      .sort-handle {
         font-size: 1.4rem;
         color: #94a3b8;
         cursor: grab;
         padding: 0 4px;
      }

      .sort-num {
         background: var(--secondary-color);
         color: white;
         width: 28px;
         height: 28px;
         border-radius: 50%;
         display: flex;
         align-items: center;
         justify-content: center;
         font-size: 0.95rem;
         font-weight: bold;
         flex-shrink: 0;
      }

      .sort-text {
         flex: 1;
         font-size: clamp(0.95rem, 3.5vw, 1.15rem);
         line-height: 1.4;
         word-break: break-word;
      }

      .sort-controls {
         display: flex;
         flex-direction: column;
         gap: 4px;
         flex-shrink: 0;
      }

      .btn-sort-move {
         background: #f1f5f9;
         border: 1.5px solid #cbd5e1;
         border-radius: 8px;
         padding: 6px 10px;
         font-size: 0.75rem;
         font-weight: bold;
         color: #475569;
         cursor: pointer;
         touch-action: manipulation;
      }

      .btn-sort-move:active {
         background: var(--secondary-color);
         color: white;
      }

      /* パズルスタイル */
      .puzzle-board-container {
         display: flex;
         flex-direction: column;
         align-items: center;
         user-select: none;
      }

      .puzzle-board-4x6 {
         position: relative;
         display: grid;
         grid-template-columns: repeat(6, var(--cell-size));
         grid-template-rows: repeat(4, var(--cell-size));
         width: calc(var(--cell-size) * 6);
         height: calc(var(--cell-size) * 4);
         margin: 0 auto 16px auto;
         border: 3px solid #334155;
         border-radius: 12px;
         background: #cbd5e1;
         box-sizing: content-box;
      }

      .puzzle-cell {
         width: var(--cell-size);
         height: var(--cell-size);
         background: #f8fafc;
         border: 1px dashed #94a3b8;
         box-sizing: border-box;
      }

      .puzzle-mino-pool {
         display: flex;
         flex-wrap: wrap;
         gap: 12px;
         justify-content: center;
         align-items: flex-start;
         padding: 16px;
         background: #f1f5f9;
         border-radius: 12px;
         min-height: 140px;
         width: 100%;
         box-sizing: border-box;
      }

      .mino-piece {
         position: relative;
         cursor: grab;
         touch-action: none;
         user-select: none;
      }

      .mino-piece.dragging {
         cursor: grabbing;
         z-index: 1000 !important;
         opacity: 0.9;
      }

      .mino-block {
         position: absolute;
         width: var(--cell-size);
         height: var(--cell-size);
         box-sizing: border-box;
         border: 1px solid rgba(255, 255, 255, 0.8);
         background-repeat: no-repeat;
         pointer-events: none;
      }

      .slide-card {
         background: #f0f9ff;
         border: 2px solid #0284c7;
         border-radius: 18px;
         padding: 20px;
         line-height: 1.8;
      }

      .slide-card h2 {
         color: #0369a1;
         margin-top: 0;
      }

      .explanation-card {
         background: #f0fdf4;
         border: 2px solid #86efac;
         border-radius: 18px;
         padding: 18px;
         margin-top: 22px;
      }

      .overlay {
         position: absolute;
         top: 0;
         left: 0;
         right: 0;
         bottom: 0;
         background: rgba(255, 255, 255, 0.95);
         display: flex;
         flex-direction: column;
         justify-content: center;
         align-items: center;
         z-index: 2000;
         padding: 12px;
         text-align: center;
      }

      .drumroll-text {
         font-size: clamp(1.4rem, 5vw, 2.2rem);
         font-weight: bold;
         color: var(--primary-color);
         animation: pulse 0.3s infinite alternate;
      }

      .result-mark {
         font-size: clamp(2rem, 8vw, 3.8rem);
         font-weight: bold;
      }

      .mark-correct {
         color: #22c55e;
         animation: popIn var(--anim-speed) ease-out;
      }

      .mark-wrong {
         color: #ef4444;
         animation: shake var(--anim-speed) ease-in-out;
      }

      @keyframes pulse {
         from {
            transform: scale(1);
         }

         to {
            transform: scale(1.08);
         }
      }

      @keyframes popIn {
         0% {
            transform: scale(0);
         }

         100% {
            transform: scale(1);
         }
      }

      @keyframes shake {

         0%,
         100% {
            transform: translateX(0);
         }

         40%,
         80% {
            transform: translateX(10px);
         }
      }

      @media (max-width: 480px) {

         .options-grid,
         .drop-categories {
            grid-template-columns: 1fr;
         }
      }

      .hidden {
         display: none !important;
      }

      /* ===== リファクタリングで追加 ===== */
      .home-title { text-align: center; color: var(--primary-color); margin-top: 0; }
      .slide-image { text-align: center; margin-bottom: 15px; }
      .slide-image img { max-width: 100%; border-radius: 12px; }
      .slide-text { white-space: pre-wrap; }
      .exp-text { line-height: 1.7; white-space: pre-wrap; }
      .exp-ok { color: #16a34a; }
      .exp-ng { color: #dc2626; }
      .btn-option span { white-space: pre-line; } /* データ内の \n を改行として表示 */
      .hint { margin: 0 0 4px; font-size: 0.85rem; color: #64748b; text-align: center; }
      .drag-item { touch-action: manipulation; }
      .drag-item.picked { border-color: #0284c7; background: #e0f2fe; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.3); }
      button:focus-visible, select:focus-visible { outline: 3px solid #0284c7; outline-offset: 2px; }
      @media (max-width: 480px) { :root { --cell-size: 42px; } } /* スマホでパズル盤面がはみ出さない */

</style>
</head>

<body>
   <header>
      <h1 id="appTitle">クイズチャレンジ</h1>
   </header>

   <main class="quiz-card">
      <nav id="navBar" class="nav-bar hidden">
         <button id="btnHome" class="nav-btn home-btn" type="button">🏠 ホーム</button>
         <button id="btnPrev" class="nav-btn" type="button">◀ まえ</button>
         <button id="btnNext" class="nav-btn" type="button">つぎ ▶</button>
         <select id="quizSelect" class="quiz-select" aria-label="もんだいを えらぶ"></select>
      </nav>

      <div id="overlay" class="overlay hidden" role="status" aria-live="polite">
         <div id="overlayContent"></div>
      </div>

      <div id="quizContent"></div>

      <div id="explanationBox" class="explanation-card hidden">
         <h3 id="expStatus"></h3>
         <p id="expText" class="exp-text"></p>
      </div>
   </main>

   <script src="quiz-data.js"></script>
   <script>
      "use strict";

      /* ==========================================================
       * 1. 設定（クイズデータは quiz-data.js にあります）
       * ========================================================== */
      const CONFIG = {
         drumrollDuration: 8000,
         resultDisplayTime: 3000,
         sounds: {
            drumroll: "https://otologic.jp/sounds/se/pre2/Quiz-Results01-3.mp3",
            correct: "https://otologic.jp/sounds/se/pre2/Quiz-Ding_Dong03-1(Short).mp3",
            wrong: "https://otologic.jp/sounds/se/pre2/Quiz-Buzzer02-5(Multi).mp3"
         }
      };


      /* ==========================================================
       * 3. ユーティリティ
       * ========================================================== */
      const PUZZLE = { rows: 4, cols: 6 };
      const $ = id => document.getElementById(id);

      /** 要素を作る小さなヘルパー */
      function h(tag, className = "", props = {}) {
         const node = document.createElement(tag);
         if (className) node.className = className;
         return Object.assign(node, props);
      }

      /** Fisher-Yates シャッフル（sort(random) より偏りが少ない） */
      function shuffle(arr) {
         const a = [...arr];
         for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
         }
         return a;
      }

      const sameSet = (a, b) => a.length === b.length && a.every(v => b.includes(v));
      const normalizeOption = o => (typeof o === "object" ? o : { text: o });

      /* ==========================================================
       * 4. 状態
       * ========================================================== */
      const state = { themeIdx: null, qIdx: 0, timers: [], locked: false };
      const currentTheme = () => quizThemes[state.themeIdx];
      const currentItem = () => currentTheme().questions[state.qIdx];

      /* ==========================================================
       * 5. 音
       * ========================================================== */
      const audio = {};
      let audioUnlocked = false;

      function initAudio() {
         for (const [name, url] of Object.entries(CONFIG.sounds)) {
            audio[name] = new Audio(url);
            audio[name].preload = "auto";
         }
      }

      /** iPad等の自動再生制限の解除（無音で一度再生） */
      function unlockAudio() {
         if (audioUnlocked) return;
         audioUnlocked = true;
         Object.values(audio).forEach(a => {
            a.muted = true;
            a.play()
               .then(() => { a.pause(); a.currentTime = 0; })
               .catch(() => { })
               .finally(() => { a.muted = false; });
         });
      }

      function playSound(name) {
         const a = audio[name];
         if (!a) return;
         a.currentTime = 0;
         a.play().catch(() => { });
      }

      function stopSound(name) {
         const a = audio[name];
         if (!a) return;
         a.pause();
         a.currentTime = 0;
      }

      /* ==========================================================
       * 6. 正誤判定・演出
       * ========================================================== */
      const later = (ms, fn) => state.timers.push(setTimeout(fn, ms));

      /** 演出中のタイマー・音・オーバーレイを全部止める（画面移動時に呼ぶ） */
      function cancelAnswer() {
         state.timers.forEach(clearTimeout);
         state.timers = [];
         state.locked = false;
         Object.keys(audio).forEach(stopSound);
         $("overlay").classList.add("hidden");
      }

      function checkAnswer(isCorrect) {
         if (state.locked) return;
         state.locked = true;

         const box = $("overlayContent");
         $("overlay").classList.remove("hidden");
         box.innerHTML = `<div class="drumroll-text">こたえは...</div>`;
         playSound("drumroll");

         later(CONFIG.drumrollDuration, () => {
            stopSound("drumroll");
            playSound(isCorrect ? "correct" : "wrong");
            box.innerHTML = isCorrect
               ? `<div class="result-mark mark-correct">⭕ せいかい！</div>`
               : `<div class="result-mark mark-wrong">❌ ざんねん！</div>`;

            later(CONFIG.resultDisplayTime, () => {
               $("overlay").classList.add("hidden");
               state.locked = false; // 解説後はもう一度挑戦できる
               showExplanation(isCorrect);
            });
         });
      }

      function showExplanation(isCorrect) {
         const status = $("expStatus");
         status.textContent = isCorrect ? "🎉 せいかい！" : "🤔 おしい！";
         status.className = isCorrect ? "exp-ok" : "exp-ng";
         $("expText").textContent = currentItem().explanation || "";
         $("explanationBox").classList.remove("hidden");
      }

      /* ==========================================================
       * 7. 画面遷移（ホーム / ナビゲーション）
       * ========================================================== */
      function goHome() {
         cancelAnswer();
         state.themeIdx = null;
         state.qIdx = 0;
         $("appTitle").textContent = "クイズチャレンジ";
         $("navBar").classList.add("hidden");
         $("explanationBox").classList.add("hidden");

         const container = $("quizContent");
         container.innerHTML = "";
         container.append(h("h2", "home-title", { textContent: "あそぶ クイズを えらんでね！" }));

         const grid = h("div", "home-grid");
         quizThemes.forEach((theme, idx) => {
            const card = h("div", "theme-card", { onclick: () => startTheme(idx) });
            card.innerHTML = `
               <div>
                  ${theme.image ? `<img src="${theme.image}" alt="" loading="lazy">` : ""}
                  <div class="theme-title">${theme.title}</div>
                  <div class="theme-desc">${theme.description || ""}</div>
               </div>
               <button class="btn-start-theme" type="button">はじめる！</button>`;
            grid.append(card);
         });
         container.append(grid);
      }

      function startTheme(idx) {
         unlockAudio();
         state.themeIdx = idx;
         state.qIdx = 0;
         $("appTitle").textContent = currentTheme().title;
         $("navBar").classList.remove("hidden");
         buildQuizSelect();
         renderQuiz();
      }

      function buildQuizSelect() {
         const select = $("quizSelect");
         select.innerHTML = "";
         let qNum = 0;
         currentTheme().questions.forEach((q, idx) => {
            let label;
            if (q.type === "slide") {
               label = `📚 ${q.title}`;
            } else {
               qNum++;
               const text = q.question || "";
               label = `Q${qNum}. ${text.length > 10 ? text.slice(0, 10) + "..." : text}`;
            }
            select.append(h("option", "", { value: idx, textContent: label }));
         });
      }

      function goTo(idx) {
         const last = currentTheme().questions.length - 1;
         if (idx < 0 || idx > last) return;
         cancelAnswer();
         state.qIdx = idx;
         renderQuiz();
      }

      function updateNav() {
         const last = currentTheme().questions.length - 1;
         $("btnPrev").disabled = state.qIdx === 0;
         $("btnNext").disabled = state.qIdx === last;
         $("quizSelect").value = state.qIdx;
      }

      /* ==========================================================
       * 8. 問題の描画（タイプ別）
       * ========================================================== */
      const RENDERERS = {
         single: renderChoice,
         binary: renderChoice,
         "bible-first": renderChoice,
         multiple: renderMultiple,
         classify: renderClassify,
         sort: renderSort,
         puzzle: renderPuzzle
      };

      function renderQuiz() {
         updateNav();
         $("explanationBox").classList.add("hidden");
         const container = $("quizContent");
         container.innerHTML = "";
         const item = currentItem();

         if (item.badge) container.append(h("span", "question-badge", { textContent: item.badge }));

         if (item.type === "slide") return renderSlide(container, item);

         if (item.image) {
            const box = h("div", "question-image");
            box.append(h("img", "", { src: item.image, alt: "" }));
            container.append(box);
         }
         if (item.bibleText) {
            const box = h("div", "bible-read-box");
            box.innerHTML = `<strong>📖 まず 聖句（せいく）を 読もう！</strong><br>${item.bibleText}`;
            container.append(box);
         }
         container.append(h("h2", "question-title", { textContent: item.question }));

         const render = RENDERERS[item.type];
         if (render) render(container, item);
         else container.append(h("p", "", { textContent: `未対応の問題タイプです: ${item.type}` }));
      }

      function addSubmit(container, label, onClick) {
         container.append(h("button", "submit-btn", { type: "button", textContent: label, onclick: onClick }));
      }

      function optionButton(opt) {
         const btn = h("button", "btn-option", { type: "button" });
         if (opt.image) btn.append(h("img", "", { src: opt.image, alt: "", loading: "lazy" }));
         btn.append(h("span", "", { textContent: opt.text }));
         return btn;
      }

      /* --- slide --- */
      function renderSlide(container, item) {
         const isLast = state.qIdx === currentTheme().questions.length - 1;
         const card = h("div", "slide-card");
         card.append(h("h2", "", { textContent: item.title }));
         if (item.image) {
            const box = h("div", "slide-image");
            box.append(h("img", "", { src: item.image, alt: "" }));
            card.append(box);
         }
         const p = h("p", "slide-text");
         p.innerHTML = item.content; // リンク(<a>)を含むため HTML のまま（データは自作のみ）
         card.append(p);
         addSubmit(card, isLast ? "ホームへ もどる" : "つぎへ▶", isLast ? goHome : () => goTo(state.qIdx + 1));
         container.append(card);
      }

      /* --- single / binary / bible-first --- */
      function renderChoice(container, item) {
         const grid = h("div", "options-grid");
         item.options.map(normalizeOption).forEach(opt => {
            const btn = optionButton(opt);
            btn.onclick = () => checkAnswer(opt.text === item.answer);
            grid.append(btn);
         });
         container.append(grid);
      }

      /* --- multiple --- */
      function renderMultiple(container, item) {
         const grid = h("div", "options-grid");
         const selected = new Set();
         item.options.map(normalizeOption).forEach(opt => {
            const btn = optionButton(opt);
            btn.onclick = () => {
               selected.has(opt.text) ? selected.delete(opt.text) : selected.add(opt.text);
               btn.classList.toggle("selected", selected.has(opt.text));
            };
            grid.append(btn);
         });
         container.append(grid);

         addSubmit(container, "答えあわせ！", () => {
            const correct = Array.isArray(item.answer) ? item.answer : [item.answer];
            checkAnswer(sameSet(correct, [...selected]));
         });
      }

      /* --- classify（ドラッグ＆ドロップ + タップでも移動可） --- */
      function renderClassify(container, item) {
         let dragged = null; // ドラッグ中の要素
         let picked = null;  // タップで選択中の要素（タッチ端末向け）

         const pool = h("div", "drag-items-pool");
         const zones = item.categories.map(cat => {
            const zone = h("div", "drop-zone");
            zone.dataset.category = cat;
            zone.append(h("h4", "", { textContent: cat }));
            return zone;
         });

         const unpick = () => { picked?.classList.remove("picked"); picked = null; };

         const cards = shuffle(item.items).map(it => {
            const card = h("div", "drag-item", { textContent: it.text, draggable: true });
            card.dataset.category = it.category;
            card.ondragstart = e => { dragged = card; e.dataTransfer.setData("text", it.id); };
            card.onclick = e => {
               e.stopPropagation();
               const same = picked === card;
               unpick();
               if (!same) { picked = card; card.classList.add("picked"); }
            };
            return card;
         });
         pool.append(...cards);

         [pool, ...zones].forEach(target => {
            target.ondragover = e => e.preventDefault();
            target.ondrop = e => { e.preventDefault(); if (dragged) target.append(dragged); };
            target.onclick = () => { if (picked) { target.append(picked); unpick(); } };
         });

         container.append(h("p", "hint", { textContent: "ドラッグ、または ことばを タップ → はこを タップで うごかせるよ" }));
         const wrap = h("div", "classify-container");
         const catGrid = h("div", "drop-categories");
         catGrid.append(...zones);
         wrap.append(pool, catGrid);
         container.append(wrap);

         addSubmit(container, "チェック！", () => {
            const allPlaced = pool.children.length === 0;
            const allRight = zones.every(z =>
               [...z.querySelectorAll(".drag-item")].every(i => i.dataset.category === z.dataset.category));
            checkAnswer(allPlaced && allRight);
         });
      }

      /* --- sort --- */
      function renderSort(container, item) {
         const list = h("div", "sort-list");
         const renumber = () => [...list.children].forEach((row, i) => {
            row.querySelector(".sort-num").textContent = i + 1;
         });
         const isSolved = arr => arr.every((it, i) => it.id === item.correctOrder[i]);

         // 最初から正解の並びにならないようにする
         let order = shuffle(item.items);
         while (order.length > 1 && isSolved(order)) order = shuffle(item.items);

         order.forEach(it => {
            const row = h("div", "sort-item");
            row.dataset.id = it.id;
            row.innerHTML = `
               <span class="sort-handle">☰</span>
               <span class="sort-num"></span>
               <span class="sort-text"></span>
               <div class="sort-controls">
                  <button type="button" class="btn-sort-move" data-dir="-1">▲ うえへ</button>
                  <button type="button" class="btn-sort-move" data-dir="1">▼ したへ</button>
               </div>`;
            row.querySelector(".sort-text").textContent = it.text;

            row.querySelectorAll(".btn-sort-move").forEach(btn => {
               btn.onclick = e => {
                  e.stopPropagation();
                  const up = btn.dataset.dir === "-1";
                  const sibling = up ? row.previousElementSibling : row.nextElementSibling;
                  if (!sibling) return;
                  list.insertBefore(up ? row : sibling, up ? sibling : row);
                  renumber();
               };
            });

            attachSortDrag(row, list, renumber);
            list.append(row);
         });

         container.append(list);
         renumber();

         addSubmit(container, "じゅんばんをチェック！", () => {
            const current = [...list.children].map(r => r.dataset.id);
            checkAnswer(current.length === item.correctOrder.length &&
               current.every((id, i) => id === item.correctOrder[i]));
         });
      }

      function attachSortDrag(row, list, renumber) {
         let dragging = false;

         row.addEventListener("pointerdown", e => {
            if (e.target.closest(".btn-sort-move")) return;
            dragging = true;
            row.classList.add("dragging");
            row.setPointerCapture(e.pointerId);
         });

         row.addEventListener("pointermove", e => {
            if (!dragging) return;
            const next = [...list.children]
               .filter(c => c !== row)
               .find(c => {
                  const box = c.getBoundingClientRect();
                  return e.clientY < box.top + box.height / 2;
               });
            list.insertBefore(row, next || null);
            renumber();
         });

         const stop = e => {
            if (!dragging) return;
            dragging = false;
            row.classList.remove("dragging");
            try { row.releasePointerCapture(e.pointerId); } catch { }
         };
         row.addEventListener("pointerup", stop);
         row.addEventListener("pointercancel", stop);
      }

      /* --- puzzle --- */
      function renderPuzzle(container, item) {
         const { rows, cols } = PUZZLE;
         const cell = parseInt(getComputedStyle(document.documentElement).getPropertyValue("--cell-size"), 10) || 55;
         const grid = Array.from({ length: rows }, () => Array(cols).fill(null)); // 盤面の占有状況
         const pieces = [];

         const wrap = h("div", "puzzle-board-container");
         const board = h("div", "puzzle-board-4x6");
         const pool = h("div", "puzzle-mino-pool");
         for (let i = 0; i < rows * cols; i++) board.append(h("div", "puzzle-cell"));
         wrap.append(board, pool);
         container.append(wrap);

         const loader = new Image();
         loader.onerror = () => { pool.textContent = "がぞうを よみこめなかったよ…"; };
         loader.onload = () => {
            generatePolyominos(rows, cols).forEach(blocks => {
               const piece = buildPiece(blocks, item.imageUrl, rows, cols, cell);
               pieces.push(piece);
               attachPieceDrag(piece, { board, pool, grid, rows, cols, cell });
               pool.append(piece.el);
            });
         };
         loader.src = item.imageUrl;

         addSubmit(container, "パズルを答えあわせ！", () => {
            const solved = pieces.length > 0 && pieces.every(p =>
               p.target && p.target.row === p.originR && p.target.col === p.originC);
            checkAnswer(solved);
         });
      }

      /** ランダムな 2〜4 マスのピースで盤面を敷き詰める */
      function generatePolyominos(rows, cols) {
         const used = Array.from({ length: rows }, () => Array(cols).fill(false));
         const DIRS = [[0, 1], [1, 0], [0, -1], [-1, 0]];
         const result = [];

         for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
               if (used[r][c]) continue;
               const size = 2 + Math.floor(Math.random() * 3);
               const blocks = [{ r, c }];
               used[r][c] = true;

               while (blocks.length < size) {
                  const candidates = blocks
                     .flatMap(b => DIRS.map(([dr, dc]) => ({ r: b.r + dr, c: b.c + dc })))
                     .filter(n => n.r >= 0 && n.r < rows && n.c >= 0 && n.c < cols && !used[n.r][n.c]);
                  if (!candidates.length) break;
                  const next = candidates[Math.floor(Math.random() * candidates.length)];
                  used[next.r][next.c] = true;
                  blocks.push(next);
               }
               result.push(blocks);
            }
         }
         return result;
      }

      function buildPiece(blocks, imageUrl, rows, cols, cell) {
         const minR = Math.min(...blocks.map(b => b.r)), maxR = Math.max(...blocks.map(b => b.r));
         const minC = Math.min(...blocks.map(b => b.c)), maxC = Math.max(...blocks.map(b => b.c));
         const w = maxC - minC + 1, hh = maxR - minR + 1;

         const el = h("div", "mino-piece");
         el.style.width = `${w * cell}px`;
         el.style.height = `${hh * cell}px`;

         blocks.forEach(b => {
            const block = h("div", "mino-block");
            block.style.left = `${(b.c - minC) * cell}px`;
            block.style.top = `${(b.r - minR) * cell}px`;
            block.style.backgroundImage = `url(${imageUrl})`;
            block.style.backgroundSize = `${cols * cell}px ${rows * cell}px`;
            block.style.backgroundPosition = `-${b.c * cell}px -${b.r * cell}px`;
            el.append(block);
         });

         return {
            el, w, h: hh, originR: minR, originC: minC,
            shape: blocks.map(b => ({ dr: b.r - minR, dc: b.c - minC })),
            target: null // 盤面に置かれたときの {row, col}
         };
      }

      function attachPieceDrag(piece, { board, pool, grid, rows, cols, cell }) {
         const el = piece.el;
         let dragging = false, startX, startY, baseLeft, baseTop;

         const release = () => { // 盤面の占有を解除
            if (!piece.target) return;
            piece.shape.forEach(({ dr, dc }) => {
               const r = piece.target.row + dr, c = piece.target.col + dc;
               if (grid[r]?.[c] === piece) grid[r][c] = null;
            });
            piece.target = null;
         };

         const canPlace = (row, col) =>
            row >= 0 && col >= 0 && row + piece.h <= rows && col + piece.w <= cols &&
            piece.shape.every(({ dr, dc }) => grid[row + dr][col + dc] === null);

         el.onpointerdown = e => {
            e.preventDefault();
            release();
            const rect = el.getBoundingClientRect();
            if (el.parentElement !== document.body) {
               el.style.position = "fixed";
               el.style.left = `${rect.left}px`;
               el.style.top = `${rect.top}px`;
               document.body.append(el); // 付け替えてからキャプチャしないと解除される場合がある
            }
            el.setPointerCapture(e.pointerId);
            dragging = true;
            el.classList.add("dragging");
            startX = e.clientX; startY = e.clientY;
            baseLeft = rect.left; baseTop = rect.top;
         };

         el.onpointermove = e => {
            if (!dragging) return;
            el.style.left = `${baseLeft + e.clientX - startX}px`;
            el.style.top = `${baseTop + e.clientY - startY}px`;
         };

         const drop = e => {
            if (!dragging) return;
            dragging = false;
            try { el.releasePointerCapture(e.pointerId); } catch { }
            el.classList.remove("dragging");

            const b = board.getBoundingClientRect(), m = el.getBoundingClientRect();
            const col = Math.round((m.left - b.left - board.clientLeft) / cell);
            const row = Math.round((m.top - b.top - board.clientTop) / cell);

            if (canPlace(row, col)) {
               el.style.position = "absolute";
               el.style.left = `${col * cell}px`;
               el.style.top = `${row * cell}px`;
               piece.target = { row, col };
               piece.shape.forEach(({ dr, dc }) => { grid[row + dr][col + dc] = piece; });
               board.append(el);
            } else {
               el.style.position = "relative";
               el.style.left = "0px";
               el.style.top = "0px";
               pool.append(el);
            }
         };
         el.onpointerup = drop;
         el.onpointercancel = drop;
      }

      /* ==========================================================
       * 9. 起動
       * ========================================================== */
      initAudio();
      document.addEventListener("pointerdown", unlockAudio, { once: true });
      $("btnHome").onclick = goHome;
      $("btnPrev").onclick = () => goTo(state.qIdx - 1);
      $("btnNext").onclick = () => goTo(state.qIdx + 1);
      $("quizSelect").onchange = e => goTo(Number(e.target.value));
      goHome();
   </script>
</body>
